schema_version: 1

module:
  name: nsx-sensors
  type: runtime
  version: "0.3.0"

support:
  ambiqsuite: true
  zephyr: false

summary: Portable BME688/LED Stick cores and transitional NSX-only sensor drivers.
# Unreleased foundation: NSX builds explicitly enable NSX_SENSORS_LEGACY_NSX.
# That aggregate contains the four unmigrated drivers; see docs/migration.

capabilities:
  - sensors
  - i2c_devices
  - spi_devices
  - measurement_devices
  - accessories
  - bme688
  - environmental_sensing
  - icm45605
  - 6dof

use_cases:
  - imu bring-up
  - bio-sensor capture
  - temperature, pressure, humidity, and raw gas resistance
  - current and voltage monitoring
  - simple i2c accessory control
  - 6dof imu bring-up

agent_keywords:
  - sensor
  - imu
  - max86150
  - mpu6050
  - bme688
  - ina228
  - ledstick
  - icm45605
  - 6dof

build:
  cmake:
    package: nsx_sensors
    targets:
      - nsx::sensors

depends:
  required:
    - nsx-core
    - nsx-i2c
    - nsx-spi
  optional: []

# Declared reach is the intersection of what nsx-core, nsx-i2c, and nsx-spi
# declare; this module has no SoC-conditional code. A declaration is a build
# expectation, not a hardware-validation claim. apollo5b is deliberately absent:
# it is descriptor-only in nsx-ambiq-sdk and is declared by none of the three
# required dependencies. See docs/compatibility.md.
compatibility:
  boards:
    - "*"
  socs:
    - apollo3
    - apollo3p
    - apollo4l
    - apollo4p
    - apollo330P
    - apollo510
    - apollo510b
    - apollo510L
  toolchains:
    - arm-none-eabi-gcc
    - armclang
    - atfe
